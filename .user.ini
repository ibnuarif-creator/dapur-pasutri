; Batas PHP untuk shared hosting (cPanel PHP-FPM/LSAPI membaca file ini; diabaikan
; bila tidak didukung). Default cPanel sering upload_max_filesize=2M dan
; gc_maxlifetime=1440 (24 menit) — terlalu kecil untuk portal.
; Kalau cPanel "MultiPHP INI Editor" menimpa file ini, set nilai yang sama di sana.
upload_max_filesize = 8M
post_max_size = 32M
max_file_uploads = 20
memory_limit = 256M
session.gc_maxlifetime = 7800
